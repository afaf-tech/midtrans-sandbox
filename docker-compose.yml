services:
  app:
    build: .
    container_name: midtrans-sandbox
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Opsional: Cloudflare Tunnel buat static domain.
  # Aktifkan dengan: docker compose --profile tunnel up -d
  # Butuh CLOUDFLARE_TUNNEL_TOKEN di .env (tunnel di Cloudflare Zero Trust).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped
    profiles:
      - tunnel
